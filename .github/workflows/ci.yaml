name: Wedding Salon CI

on:
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # JOB 1 - LINT
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  # ==========================================
  # JOB 2 - SONARQUBE
  # ==========================================
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ==========================================
  # JOB 3 - TRIVY
  # ==========================================
  trivy:
    name: Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1


  # ==========================================
  # JOB 4 - BUILD APPLICATION
  # Runs only after Lint + SonarQube + Trivy
  # ==========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs:
      - lint
      - sonarqube
      - trivy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify dist
        run: ls -la dist


  # ==========================================
  # JOB 5 - BUILD DOCKER IMAGE
  # Runs only after Build succeeds
  # ==========================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t wedding-salon:${{ github.sha }} \
            .

      - name: Show Docker images
        run: docker images

      - name: Run container
        run: |
          docker run -d \
            --name wedding-salon \
            -p 8080:80 \
            wedding-salon:${{ github.sha }}

      - name: Wait for application
        run: sleep 5

      - name: Test container
        run: curl --fail http://localhost:8080

      - name: Show running container
        run: docker ps
